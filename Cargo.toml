[workspace]
resolver = "2"
members = ["crates/hw-real", "crates/hw-flashmath", "crates/hw-core", "crates/hw-data", "crates/hw-cli", "crates/obby-search"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
# Unwinding lets searches catch a panic from a rare exotic simulation state per trial instead of
# losing the whole run. Measured cost against "abort": within run-to-run noise (about 1-4%).
panic = "unwind"
overflow-checks = false
debug = 1
